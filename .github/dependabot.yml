version: 2

updates:
  # Keep the Actions used by CI current and pinned.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns: ["*"]

  # The application stack is an open decision (AGENTS.md §9).
  # When a package manager is adopted, add its ecosystem here, e.g.:
  #
  # - package-ecosystem: npm
  #   directory: "/"
  #   schedule: { interval: weekly }
  #   commit-message: { prefix: chore, include: scope }
