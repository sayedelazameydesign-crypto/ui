name: guard

# Deterministic convention + secret guard. No installs beyond jq, no build step required.
# Mirrors scripts/check-repo.sh — the same script a contributor runs locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guard:
    name: Repository guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the guard inspects commits against origin/main

      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq
          fi

      - name: Run scripts/check-repo.sh
        run: |
          chmod +x scripts/check-repo.sh
          scripts/check-repo.sh
