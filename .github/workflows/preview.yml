name: preview

# Ephemeral sandbox per pull request. Dormant while the repository has no runtime
# (L0 / ADR-0002): it says so instead of pretending to deploy.
# Docs: docs/ci/ephemeral-environments.md

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sandbox:
    name: Build in an isolated runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.action != 'closed'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify change (routing)
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/change-classifier.mjs --base "origin/${BASE_REF}" --head HEAD --github-output

      - name: Skip notice for docs-only changes
        if: steps.classify.outputs.needs_preview == 'false'
        run: echo "::notice::docs-only change — no sandbox needed (docs/ci/green-builds.md)"

      - name: Detect runtime
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "runtime=node" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.detect.outputs.present == 'true' && steps.classify.outputs.needs_preview == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install from lockfile only
        if: steps.detect.outputs.present == 'true' && steps.classify.outputs.needs_preview == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi

      - name: Build
        if: steps.detect.outputs.present == 'true' && steps.classify.outputs.needs_preview == 'true'
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "::notice::no build script defined — nothing to build"
          fi

      - name: Upload build output
        if: steps.detect.outputs.present == 'true' && steps.classify.outputs.needs_preview == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: |
            dist
            .next
            build
          retention-days: 7
          if-no-files-found: ignore

      - name: Explain the dormant state once
        if: steps.detect.outputs.present == 'false' && github.event.action == 'opened'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                "### preview",
                "",
                "No runtime exists yet (**L0**, see `docs/adr/0002-defer-stack-choice.md`),",
                "so this workflow verified the repository only — it did not deploy anything.",
                "",
                "Per-PR preview URLs will activate automatically once an application manifest",
                "and a hosting target exist (`docs/ci/ephemeral-environments.md`).",
              ].join("\n"),
            });

  teardown:
    name: Teardown on close
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm nothing is left running
        run: |
          echo "Preview environments are ephemeral by construction: no deployment was made,"
          echo "and the runner for this pull request is already destroyed."
