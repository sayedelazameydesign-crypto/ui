name: property-tests

# Invariant checks over generated input + deterministic mock-server smoke test.
# Zero dependencies, offline, seeded. Docs: docs/ci/testing-strategy.md

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  properties:
    name: Properties & mocks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run properties (deep)
        run: node scripts/property-test.mjs --runs 300

      - name: Start mock server
        run: node scripts/mock-server.mjs --port 4010 --quiet >/dev/null 2>&1 &

      - name: Verify mock server contract
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4010/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4010/health | jq -e '.status == "ok"'
          curl -fsS "http://127.0.0.1:4010/v1/embeddings?q=provenance" | jq -e '.data[0].embedding | length > 0'
          curl -fsS "http://127.0.0.1:4010/repos/o/r/issues" | jq -e 'length > 0'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:4010/health?status=503')" = "503"
          echo "mock contract verified"

      - name: Stop mock server
        if: always()
        run: pkill -f "scripts/mock-server.mjs" || true
